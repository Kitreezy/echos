name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: macos-latest
    env:
      # В pbxproj есть кириллица, и без UTF-8 локали xcodeproj падает
      # на чтении файла ещё до запуска xcodebuild.
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4

      # Раннер несёт несколько версий Xcode; берётся старшая, чтобы не
      # переписывать путь при каждом обновлении образа.
      - name: Выбрать Xcode
        id: xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Xcode: $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version
          echo "version=$(xcodebuild -version | head -1 | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/xcode-cache
        id: cache
        with:
          xcode: ${{ steps.xcode.outputs.version }}

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Тесты
        run: |
          start=$(date +%s)
          bundle exec fastlane tests
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
        id: tests

      # Итог виден на странице прогона без раскрытия логов: попал ли кэш
      # и сколько заняли тесты. По этим цифрам и сравниваются прогоны.
      - name: Сводка
        if: always()
        run: |
          {
            echo "| | |"
            echo "|---|---|"
            echo "| Пакеты SPM из кэша | ${{ steps.cache.outputs.spm-hit || 'нет' }} |"
            echo "| DerivedData из кэша | ${{ steps.cache.outputs.derived-data-key || 'нет' }} |"
            echo "| Тесты, сек | ${{ steps.tests.outputs.seconds || '—' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output
          path: build/test_output
          retention-days: 7

      # Падения — отдельно и в читаемом виде, чтобы ревью ниже читало их,
      # а не лог на десятки тысяч строк.
      - name: Падения
        if: always()
        run: |
          bundle=$(ls -d build/test_output/*.xcresult 2>/dev/null | head -1)
          if [ -n "$bundle" ]; then
            xcrun xcresulttool get test-results tests --path "$bundle" \
              | python3 scripts/failures.py > build/failures.txt || true
          fi
          test -s build/failures.txt || echo "Падений нет." > build/failures.txt
          cat build/failures.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failures
          path: build/failures.txt
          retention-days: 7

  # Третий шаг цикла. Модель не собирает и не тестирует — это уже сделано
  # выше. Она читает: diff и падения. Один комментарий в PR: если тесты
  # упали — что сломалось и где; если прошли — что в diff стоит поправить
  # и чего не хватает по тестам.
  #
  # Ходит по подписке через CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`).
  # Секрета нет — job пропускается, а не падает.
  review:
    needs: tests
    if: github.event_name == 'pull_request' && always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Есть ли токен
        id: token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: echo "present=${{ env.TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        if: steps.token.outputs.present == 'true'
        with:
          name: failures
          path: build

      - uses: anthropics/claude-code-action@v1
        if: steps.token.outputs.present == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_tools: "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(cat:*)"
          # Чек-лист — docs/review-checklist.md, тот же, что у scripts/review.sh.
          # Здесь только рамка: что читать и как отвечать.
          prompt: |
            Проект echos, iOS, Swift 6. Это pull request в ${{ github.base_ref }};
            тесты уже прошли в предыдущем job, их результат: ${{ needs.tests.result }}.
            Падения, если были, лежат в build/failures.txt.

            Если тесты упали: прочитай build/failures.txt, найди код под
            упавшими тестами и объясни, что сломано и где. Не предлагай
            ослабить тест. Чек-лист в этом случае не применяй.

            Если прошли: возьми diff (git diff origin/${{ github.base_ref }}...HEAD)
            и сделай ревью по чек-листу из docs/review-checklist.md — прочитай
            файл целиком. Пройди по пунктам по порядку, по каждому либо
            «чисто», либо замечания с файлом и строкой и объяснением, почему
            это подпадает под пункт. Замечание без файла и строки не пиши.
            Сомневаешься — загляни в код рядом, не гадай по diff. Не
            пересказывай diff, не хвали, не предлагай стиль и именование. В
            конце одна фраза: стоит ли вливать как есть.

            Один комментарий, по-русски.
